version: 1

project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: dist/application.lpk
  target_arch: amd64

update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: newsnow

build:
  run_buildscript: false

images:
  - id: newsnow
    target: service
    service: newsnow
    source: ghcr.io/ourongxing/newsnow
    channel: stable
    sort: semver
    tag_regex: '^v?[0-9]+\.[0-9]+\.[0-9]+$'
    delivery:
      mode: mirror
      require_digest_match: true

stores:
  official:
    enabled: false
  private:
    enabled: true
    skip_if_version_exists: true
    name: NewsNow
    summary: 优雅地阅读实时新闻与全网热点
